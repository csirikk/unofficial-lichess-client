name: 🔄 Auto Dependency Updater

on:
  schedule:
    - cron: '0 0 * * 0' # every Sunday at 12:00 AM UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update-dependencies:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Upgrade dependencies
        run: |
          set -e
          bunx npm-check-updates -u
          bun install

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore: auto-dependency upgrade"
          title: "chore: auto-dependency upgrade"
          body: "Automated weekly dependency upgrade via npm-check-updates."
          branch: chore/auto-dependency-upgrade
          delete-branch: true
